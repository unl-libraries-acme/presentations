- date: 2026-10-15
  title: "From Review to Remediation: Building a Sustainable Reparative Metadata Workflow"
  presenters: "Broghan White, Harriet Wintermute"
  event: "NLA + MPLA Joint Conference, October 14-16, 2026"
  folder: "2026-nla-mpla"
  slides: "NLA_Review to Remediation.pdf"
  slides_notes: "NLA_Review to Remediation_speaker_notes.pdf"
  # handout: "filename.pdf"
  abstract: "This presentation describes the results of UNL Libraries’ project to implement reparative metadata practices by replacing or supplementing pejorative or outdated subject headings in our bibliographic metadata. Using examples drawn from local subject heading review and remediation workflows, it explores how librarians at UNL evaluate replacement and supplemental subject headings, determine when to replace, supplement, or retain existing headings, and document the rationale for those decisions. The presentation also addresses practical implementation methods in Ex Libris Alma, such as local authority records, normalization rules, and tools for altering how subject headings are displayed, as well as the importance of community consultation, transparency, and internal documentation in creating sustainable metadata remediation. It provides strategies for navigating the technical challenges of handling subject headings that have variant forms and for balancing local language decisions within shared bibliographic environments with numerous stakeholders. The presentation offers a practical model for institutions beginning similar reparative metadata initiatives."
  links:
      - label: "Alma normalization rules (GitHub repository)"
        url: "https://github.com/unl-libraries-acme/alma-normalization-rules"

