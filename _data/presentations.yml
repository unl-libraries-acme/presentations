- date: 2026-11-10
  title: "Review and Remediation: Building a Sustainable Reparative Metadata Workflow"
  presenters: "Broghan White"
  event: "Upper Midwest User Group Conference"
  folder: "2026-UMWUG"
  slides: "UMWUG_Review and Remediation.pdf"
  #slides_notes:
  # handout: "filename.pdf"
  abstract: "This presentation describes the results of UNL Libraries’ pilot project to implement reparative metadata practices by replacing or supplementing pejorative or outdated subject headings in our bibliographic metadata. Using examples drawn from local subject heading review and remediation workflows, it explores how librarians at UNL evaluate replacement and supplemental subject headings, determine when to replace, supplement, or retain existing headings, and document the rationale for those decisions. The presentation also addresses practical implementation methods in Ex Libris Alma, such as local authority records, normalization rules, and tools for altering how subject headings are displayed, as well as the importance of community consultation, transparency, and internal documentation in creating sustainable metadata remediation. It provides a glimpse of UNL Libraries' future work in reparative metadata, including collaboration with Backstage Library Works and expanding access to the reparative metadata working group."
